bindings: []
concept_refs: []
dimensions:
  - channel
  - category
  - region
  - user_tier
  - platform
  - seller_tier
metrics:
  - caliber_switches:
      include_refund: true
    caliber_type:
      - refund_adjustment
    definition: "支付时间在所选窗口内的合格成功支付去重订单数（基础度量，业务键 count-distinct 订单身份）。作为分母时包含符合资格的已退款支付订单（include_refund=true，与 gmv 资格与窗口一致，开关与描述不得相互矛盾）；不含未支付、支付失败与取消订单；一笔订单多次支付只计最终成功一笔。边界 [开始,结束)，时区与观察截止由任务 Binding 显式声明。"
    dimensions:
      - channel
      - category
      - region
    display_name: "支付订单数"
    name: order_count
    owner_role: "电商业务负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: simple
  - caliber_switches:
      exclude_inner_channel: true
    caliber_type:
      - scope_inclusion
    definition: "统计周期内去重访问用户数，按设备与账号联合去重；默认剔除内部渠道与机器流量"
    dimensions:
      - channel
      - region
      - platform
    display_name: "访客数"
    display_name_en: "Unique Visitors"
    name: uv
    owner_role: "增长负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: simple
  - aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_switches: {}
    definition: "下单用户数 / 访客数，衡量流量到订单的转化效率"
    dimensions:
      - channel
      - region
    display_name: "下单转化率"
    display_name_en: "Conversion Rate"
    name: cvr
    owner_role: "增长负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: ratio
    type_params:
      denominator: uv
      numerator: order_user_count
