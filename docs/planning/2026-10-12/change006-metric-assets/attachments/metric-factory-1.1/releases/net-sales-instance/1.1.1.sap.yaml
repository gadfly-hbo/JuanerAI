scenarios:
  - decision_purpose: "定位 GMV 与目标差距的量价来源，决定流量、转化、客单三侧的资源投放优先级"
    evidence_requirements: "近 13 周周粒度 gmv/uv/cvr/aov 序列与同期目标值"
    id: gmv_gap_diagnosis
    method_refs:
      - "dame.m2.driver_decomposition@1.0.0"
    metric_usages:
      - metric: gmv
        note: "差距量化对象，对齐北极星候选 gmv 的模板口径"
        role: outcome
      - metric: uv
        note: "规模侧第一层拆解（revenue 树：gmv = uv * cvr * aov）"
        role: driver
      - metric: cvr
        role: driver
      - metric: aov
        role: driver
      - metric: retention_30d
        note: "诊断期流量加码不得损伤 30 日留存"
        role: guardrail
      - metric: refund_rate
        note: "转化抢救动作不得推高退款率"
        role: guardrail
    output_spec: "一页差距归因结论 + 流量/转化/客单三侧行动优先级清单"
    question_tree:
      - id: gap_root
        label: "GMV 与目标差距多大"
        metric: gmv
      - id: uv_gap
        label: "访客规模是否拖累"
        metric: uv
        parent: gap_root
      - id: cvr_gap
        label: "下单转化是否恶化"
        metric: cvr
        parent: gap_root
      - id: aov_gap
        label: "客单价是否下滑"
        metric: aov
        parent: gap_root
    review_rules: "业务负责人确认目标口径与归因窗口后定稿"
    title: "GMV 差距诊断"
    version: 0.1.0
  - decision_purpose: "定位净销售额两期变化的销售侧与退款侧来源，决定促销售与退款治理之间的资源分配"
    evidence_requirements: "近 13 周周粒度 gmv/refund_amount/net_sales 序列及其订单与退款原始记录：订单含订单身份、支付时间、支付金额、币种、支付状态、已声明的分组属性（category）；退款含退款身份、关联订单、退款金额、币种、退款状态、退款完成时间。须显式声明时区、[开始,结束) 期间边界（周按声明时区自然周）、观察截止与金额单位；两段比较期间由用户在 13 周内明确指定；支持总体与声明适用分组（category，按关联订单属性）；合格范围内无交易周须明确展示（金额 0、退款率证据不足），不得与全空输入混淆。"
    id: net_sales_review
    method_refs:
      - "dame.descriptive_delta_decomposition@0.1.0"
    metric_usages:
      - metric: net_sales
        note: "复盘的量化对象（用户指定两段期间比较）"
        role: outcome
      - metric: gmv
        note: "销售侧拆解：原始成交总额（含后来退款的订单，gross 只计一次），与 net_sales 公式勾稽"
        role: driver
      - metric: refund_amount
        note: "退款侧拆解：合格完成退款，归属期间随 refund_to_payment_period 开关"
        role: driver
      - metric: refund_rate
        note: "支付队列退款率（分子 refunded_order_count／分母 order_count）；队列口径不随金额归属开关变化；退款治理动作不得只压退款率而牺牲净销售额"
        role: guardrail
      - metric: refunded_order_count
        note: "退款率分子：支付队列中至少一笔完成退款的去重订单数；1:N 退款只计一次；历史订单的本期退款不入本期队列"
        role: guardrail
      - metric: order_count
