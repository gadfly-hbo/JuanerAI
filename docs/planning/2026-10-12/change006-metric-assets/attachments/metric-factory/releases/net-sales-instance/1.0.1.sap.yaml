scenarios:
  - decision_purpose: "定位 GMV 与目标差距的量价来源，决定流量、转化、客单三侧的资源投放优先级"
    evidence_requirements: "近 13 周周粒度 gmv/uv/cvr/aov 序列与同期目标值"
    id: gmv_gap_diagnosis
    method_refs:
      - "dame.m2.driver_decomposition@1.0.0"
    metric_usages:
      - metric: gmv
        note: "差距量化对象，对齐北极星候选 gmv 的模板口径"
        role: outcome
      - metric: uv
        note: "规模侧第一层拆解（revenue 树：gmv = uv * cvr * aov）"
        role: driver
      - metric: cvr
        role: driver
      - metric: aov
        role: driver
      - metric: retention_30d
        note: "诊断期流量加码不得损伤 30 日留存"
        role: guardrail
      - metric: refund_rate
        note: "转化抢救动作不得推高退款率"
        role: guardrail
    output_spec: "一页差距归因结论 + 流量/转化/客单三侧行动优先级清单"
    question_tree:
      - id: gap_root
        label: "GMV 与目标差距多大"
        metric: gmv
      - id: uv_gap
        label: "访客规模是否拖累"
        metric: uv
        parent: gap_root
      - id: cvr_gap
        label: "下单转化是否恶化"
        metric: cvr
        parent: gap_root
      - id: aov_gap
        label: "客单价是否下滑"
        metric: aov
        parent: gap_root
    review_rules: "业务负责人确认目标口径与归因窗口后定稿"
    title: "GMV 差距诊断"
    version: 0.1.0
  - decision_purpose: "定位净销售额变化的销售侧与退款侧来源，决定促销售与退款治理之间的资源分配"
    evidence_requirements: "近 13 周周粒度 net_sales/gmv/refund_amount 序列与退款记录（退款记录须同时含支付时间与退款完成时间，支撑归属期间口径）"
    id: net_sales_review
    method_refs:
      - "dame.m2.driver_decomposition@1.0.0"
    metric_usages:
      - metric: net_sales
        note: "复盘的量化对象"
        role: outcome
      - metric: gmv
        note: "销售侧第一层拆解（含退款口径，与 net_sales 公式一致）"
        role: driver
      - metric: refund_amount
        note: "退款侧拖累量，口径随 refund_to_payment_period 开关"
        role: driver
      - metric: refund_rate
        note: "退款治理动作不得只压退款率而牺牲净销售额"
        role: guardrail
    output_spec: "一页净销售额归因结论 + 销售侧/退款侧行动清单"
    question_tree:
      - id: net_sales_root
        label: "净销售额变化多大"
        metric: net_sales
      - id: sales_side
        label: "销售额侧贡献多少"
        metric: gmv
        parent: net_sales_root
      - id: refund_side
        label: "退款拖累多少"
        metric: refund_amount
        parent: net_sales_root
      - id: refund_rate_check
        label: "退款率是否异常"
        metric: refund_rate
        parent: refund_side
    review_rules: "业务负责人确认退款归属期间口径（refund_to_payment_period 取值）后定稿"
    title: "净销售额复盘"
    version: 0.1.0
