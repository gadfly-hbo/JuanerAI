bindings: []
concept_refs: []
dimensions:
  - channel
  - category
  - region
  - user_tier
  - platform
  - seller_tier
metrics:
  - caliber_switches:
      exclude_inner_channel: true
      include_refund: true
      include_shipping: false
    caliber_type:
      - refund_adjustment
      - scope_inclusion
    definition: "统计周期内支付成功订单的金额合计；默认剔除退款订单、不含运费与虚拟赠品"
    dimensions:
      - channel
      - category
      - region
      - user_tier
    display_name: "成交总额"
    display_name_en: "Gross Merchandise Value"
    name: gmv
    owner_role: "电商业务负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: derived
    type_params:
      expr: "uv * cvr * aov"
  - caliber_switches:
      include_refund: false
    caliber_type:
      - refund_adjustment
    definition: "统计周期内支付成功的订单数；默认不含退款订单，一笔订单多次支付只计最终成功一笔"
    dimensions:
      - channel
      - category
      - region
    display_name: "支付订单数"
    name: order_count
    owner_role: "电商业务负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: simple
  - caliber_switches:
      exclude_inner_channel: true
    caliber_type:
      - scope_inclusion
    definition: "统计周期内去重访问用户数，按设备与账号联合去重；默认剔除内部渠道与机器流量"
    dimensions:
      - channel
      - region
      - platform
    display_name: "访客数"
    display_name_en: "Unique Visitors"
    name: uv
    owner_role: "增长负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
      - day
      - week
      - month
    type: simple
  - aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_switches: {}
    definition: "下单用户数 / 访客数，衡量流量到订单的转化效率"
    dimensions:
      - channel
      - region
    display_name: "下单转化率"
    display_name_en: "Conversion Rate"
    name: cvr
    owner_role: "增长负责人"
    provenance:
      origin: template
      template_ref: "ecommerce-marketplace@0.1.0"
    review:
      required: false
    time_grains:
